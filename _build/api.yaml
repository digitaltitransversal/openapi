  /orders/{id}/charges:
    post:
      description: |
        Create a charge for an existing order.

        Notes:
        - This endpoint creates a charge **associated to the given order** (`order_id`).
        - Some payment methods may result in a `pending_payment` charge status and can affect subsequent order operations.
        - If the order does not meet the required conditions, the API may respond with **428 Precondition Required**.
      operationId: ordersCreateCharge
      parameters:
      - description: Identifier of the resource
        example: 6307a60c41de27127515a575
        in: path
        name: id
        required: true
        schema:
