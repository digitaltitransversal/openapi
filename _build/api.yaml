                object: error
                type: resource_not_found_error
              schema:
                $ref: '#/components/schemas/error'
          description: not found entity
        "422":
          content:
            application/vnd.app-v2.2.0+json:
              example:
                details:
                - message: The name does not exist.
                  param: payment_method.name
                  code: femsa.errors.parameter_validation.payment_method.name.nonexistent_token
                  debug_message: The name does not exist.
                log_id: 641b6d813cd9a50001515017
                object: error
                type: parameter_validation_error
              schema:
                $ref: '#/components/schemas/error'
          description: parameter validation error
        "428":
          content:
            application/vnd.app-v2.2.0+json:
              example:
                details:
                - debug_message: The order cannot be modified because it has already
                    a charge which is pending payment.
                  message: The order cannot be modified because it has already a charge
                    which is pending payment.
                  param: null
