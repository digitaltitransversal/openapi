description: requested field for a refund
content:
  application/json:
    schema:
      title: order_refunds_request
      type: object
      properties:
        amount:
          type: integer
          format: int64
          example: 500
          minimum: 1
          description: Amount to refund. If not provided, the API refunds the refundable amount of the selected charge.
        charge_id:
          type: string
          nullable: true
          example: "6976b2e3c4418f00012943c5"
          description: Charge ID to refund. If not provided, the API selects a refundable charge from the order.
        reason:
          type: string
          example: "suspected_fraud"
          enum:
            - requested_by_client
            - cannot_be_fulfilled
            - duplicated_transaction
            - suspected_fraud
            - other
          description: Refund reason. If not provided, the API uses a default reason.
        expires_at:
          type: integer
          format: int64
          nullable: true
          example: 1553273553
          description: Expiration timestamp for cash refunds (must be within the allowed range configured by the API).
required: true