title: checkout_request
description: >
  Creates a Payment Link. This is a sub-resource related to an Order template:
  each time a customer pays using the link, the API will create an Order using `order_template`.
type: object
required:
  - name
  - type
  - recurrent
  - needs_shipping_contact
  - expires_at
  - allowed_payment_methods
  - order_template
properties:
  name:
    type: string
    description: Payment link name.
    example: "Payment Link Name"

  type:
    type: string
    description: Checkout type.
    example: "PaymentLink"

  recurrent:
    type: boolean
    example: false
    description: "false: single use. true: multiple payments"

  payments_limit_count:
    type: integer
    format: int32
    description: "Required when `recurrent` is true. Maximum number of payments allowed through the link."

  allowed_payment_methods:
    type: array
    items:
      type: string
    example: ["cash"]
    description: "Payment methods available in the payment link."

  needs_shipping_contact:
    type: boolean
    example: false
    description: "This flag allows you to fill in the shipping information at checkout."

  starts_at:
    type: integer
    format: int64
    description: "Start time for the link. Unix timestamp in seconds."
    example: 1680224924

  expires_at:
    type: integer
    format: int64
    example: 1680397724
    description: |
      Expiration time for the link (Unix timestamp in seconds).
      Valid range is between 2 and 365 days (calculated from the next day of creation at 00:01).

  can_not_expire:
    type: boolean
    description: "If true, the link does not expire."
    example: false

  order_template:
    description: "Attributes used to create the order when a new payment is received."
    type: object
    required:
      - currency
      - line_items
    properties:
      currency:
        type: string
        example: "MXN"
        maxLength: 3
        description: "ISO 4217 currency code for the order."

      customer_info:
        description: "Customer information used when creating the order."
        oneOf:
          - $ref: ../customers/customer_info.yml
          - $ref: ../customers/customer_info_just_customer_id.yml

      line_items:
        description: "Products to buy. Each contains unit price and quantity used to calculate the order total."
        type: array
        items:
          $ref: ../../schemas/orders/product.yml

      metadata:
        type: object
        additionalProperties: true
        maxProperties: 100
        example: { "key": "value" }
        description: "Arbitrary key-value data attached to the order for internal use."