title: webhook_key_response
description: Represents a webhook signing key configuration for the company.
type: object
required:
  - id
  - object
  - active
  - livemode
  - created_at
properties:
  id:
    type: string
    example: "62730ba6fb7dfd6a712f118e"
    description: Unique identifier of the webhook key
  object:
    type: string
    example: webhook_key
    description: Object name, value is webhook_key
  active:
    type: boolean
    example: true
    description: Indicates if the webhook key is active
  livemode:
    type: boolean
    example: false
    description: Indicates if the webhook key is in live mode
  created_at:
    type: integer
    format: int64
    example: 1577836800
    description: Unix timestamp in seconds with the creation date of the webhook key
  deactivated_at:
    type: integer
    format: int64
    nullable: true
    example: null
    description: Unix timestamp in seconds when the webhook key was deactivated (if applicable).
  deleted:
    type: boolean
    nullable: true
    example: null
    description: Present only when the webhook key is deleted.
  public_key:
    type: string
    nullable: true
    description: Public key to be used in the webhook.
    example: '-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAqULpUc6D6mSAq5a0yLY/\n...\n-----END PUBLIC KEY-----\n'