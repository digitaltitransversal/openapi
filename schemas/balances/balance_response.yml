title: balance_response
description: |
  Company balance summary.

  Monetary fields are returned as arrays of amounts grouped by currency (see `balance_common_field` items).
type: object
properties:
  available:
    type: array
    description: Amounts currently available, grouped by currency.
    items:
      $ref: './balance_common_field.yml'
  
  cashout_retention_amount:
    type: array
    description: The balance's cashout retention amount
    items:
      $ref: './balance_common_field.yml'

  conekta_retention:
    type: array
    description: The balance's Femsa retention
    items:
      $ref: './balance_common_field.yml'
    
  gateway:
    type: array
    description: Gateway balance amounts, grouped by currency.
    items:
      $ref: './balance_common_field.yml'

  pending:
    type: array
    description: Amounts pending settlement, grouped by currency.
    items:
      $ref: './balance_common_field.yml'

  retained:
    type: array
    description: Amounts currently retained, grouped by currency.
    items:
      $ref: './balance_common_field.yml'
    
  retention_amount:
    type: array
    description: Retention amount applied, grouped by currency.
    items:
      $ref: './balance_common_field.yml'
    
  target_collateral_amount:
    type: object
    description: Target collateral amount, grouped by currency.

  target_retention_amount:
    type: array
    description: Target retention amount, grouped by currency.
    items:
      $ref: './balance_common_field.yml'

  temporarily_retained:
    type: array
    description: Amounts temporarily retained
    items:
      $ref: './balance_common_field.yml'