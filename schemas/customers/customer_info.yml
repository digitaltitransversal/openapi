title:  customer_info
type: object
required:
  - name
  - email
properties:
  customer_id:
    type: string
    example: "cus_23874283647"
  name:
    type: string
    example: "DevTest"
  email:
    type: string
    format: email
    example: test@femsa.com
  phone:
    type: string
    example: "5522997233"
  corporate:
    type: boolean