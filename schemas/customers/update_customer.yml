title: customer_update_request
type: object
description: Request body to update a customer.

properties:
  name:
    type: string
    description: Customer's name.
    example: miguel

  email:
    type: string
    format: email
    description: Customer email address.
    example: miguel@gmail.com

  phone:
    type: string
    description: Customer phone number.
    example: "+5215555555555"
  
  corporate:
    type: boolean
    description: Indicates whether the customer email is corporate.
    example: false
    default: false

  custom_reference:
    type: string
    description: Merchant-defined reference used to identify the customer in your system.
    example: "customer_123"
  
  referrer:
    type: string
    description: Referrer value (if applicable).
    example: "my_platform"
  
  metadata:
    type: object
    description: Arbitrary metadata associated with the customer.
    additionalProperties: true
  
  payment_sources:
    type: array
    description: Contains details of the payment methods that the customer has active or has used in Femsa
    items:
      title: customer_payment_methods_request
      oneOf:
        - $ref: ../../schemas/customers/payment_method_cash_request.yml

  default_payment_source_id:
    type: string
    description: Sets the default payment source for the customer (must be an existing payment source on the customer).
    example: "src_1a2b3c4d5e6f7g8h"
  
  default_fiscal_entity_id:
    type: string
    description: Sets the default fiscal entity for the customer (must be an existing fiscal entity on the customer).
    example: "fe_1a2b3c4d5e6f7g8h"

  default_shipping_contact_id:
    type: string
    description: Sets the default shipping contact for the customer (must be an existing shipping contact on the customer).
    example: "ship_cont_1a2b3c4d5e6f7g8h"