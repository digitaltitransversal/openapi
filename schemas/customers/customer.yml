title: customer_request
type: object
description: Customer create request.
required:
  - name
  - email
properties:
  name:
    type: string
    description: Customer's name.
    example: miguel
  
  email:
    type: string
    format: email
    description: Customer email address.
    example: miguel@gmail.com
  
  phone:
    type: string
    description: Customer phone number.
    example: "+5215555555555"
    nullable: true
    maxLength: 19
    
  corporate:
    type: boolean
    description: Indicates whether the customer email is corporate.
    example: false
    default: false

  custom_reference:
    type: string
    description: Merchant-defined reference used to identify the customer in your system.
  
  metadata:
    type: object
    description: Arbitrary metadata associated with the customer.
    additionalProperties: true
  
  payment_sources:
    type: array
    description: Customer payment sources to be created with the customer (optional).
    items:
      title: customer_payment_methods_request
      oneOf:
        - $ref: ../../schemas/customers/payment_method_cash_request.yml

  fiscal_entities:
    type: array
    description: Customer fiscal entities to be created with the customer (optional).
    items:
      $ref: './customer_fiscal_entities_request.yml'

  shipping_contacts:
    type: array
    description: Customer shipping contacts to be created with the customer (optional).
    items:
      $ref: './customer_shipping_contacts.yml'