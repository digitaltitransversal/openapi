payment_method_cash_response:
  title: customer_payment_method_cash_response
  type: object
  description: Cash payment method response.
  allOf:
    - $ref: "./customer_payment_method_response.yml"
    - type: object
      properties:
        reference:
          type: string
          example: "93000262276908"
        barcode:
          type: string
          example: "93000262276908"
        barcode_url:
          type: string
          format: uri
          example: "https://pt-common-s3-e.png?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-"
        expires_at:
          type: integer
          format: int64
          example: 1677196303
          nullable: true
        provider:
          type: string
          example: "Oxxo"