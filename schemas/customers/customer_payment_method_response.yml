title: customer_payment_method_response
type: object
required:
  - id
  - object
  - created_at
  - type
properties:
  id:
    type: string
    example: "src_2s8K1B3PBKDontpi9"
  object:
    type: string
    example: "payment_source"
  created_at:
    type: integer
    format: int64
    example: 1675715413
  parent_id:
    type: string
    description: Customer ID this payment source belongs to.
    example: "cus_2s8K1B3PBKDontpi8"
    nullable: true
  type:
    type: string
    description: Payment method type.
    example: cash