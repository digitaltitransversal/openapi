title: customer_response
type: object
description: customer response
required:
  - id
  - livemode
  - created_at
  - object
properties:
  id:
    type: string
    example: "cus_2tHJfJ79KyUwpxTik"
    description: Customer's ID

  object:
    type: string
    enum: ["customer"]
    example: "customer"

  created_at:
    type: integer
    format: int64
    example: 1485151007
    description: Creation date of the object (Unix timestamp)

  livemode:
    type: boolean
    example: true
    description: true if the object exists in live mode or false if the object exists in test mode

  name:
    type: string
    nullable: true
    example: "Felipe"
    description: Customer's name

  email:
    type: string
    nullable: true
    example: "felipe@gmail.com"
    format: email

  phone:
    type: string
    nullable: true
    example: "5215555555555"
    description: Customer's phone number

  corporate:
    type: boolean
    description: true if the customer is a company
    example: false

  custom_reference:
    type: string
    example: "custom_reference"
    description: Custom reference

  default_fiscal_entity_id:
    type: string
    nullable: true
    example: "fis_ent_2tKqqAfqPi21oCmEJ"

  default_shipping_contact_id:
    type: string
    nullable: true
    example: "ship_cont_2tKZsTYcsryyu7Ah8"

  metadata:
    type: object
    nullable: true
    additionalProperties: true
    maxProperties: 100
    description: Customer metadata (maps to contextual_data in backend)

  payment_sources:
    title: customer_payment_methods_response
    allOf:
      - $ref: ../../schemas/pagination/pagination.yml
      - $ref: ../../schemas/pagination/page.yml
      - type: object
        title: customerPaymentMethods
        properties:
          data:
            type: array
            title: customer_payment_methods_data
            items:
              title: customer_payment_methods_data
              discriminator:
                propertyName: type
                mapping:
                  cash: payment_method_cash_response
                  oxxo_recurrent: payment_method_cash_response
              oneOf:
                - $ref: 'customer_payment_method_cash_response.yml#/payment_method_cash_response'
    
  fiscal_entities:  
    title: customer_fiscal_entities_response
    allOf:
       - $ref: ../../schemas/pagination/pagination.yml
       - type: object
         properties:
          data:
            type: array
            items:
              title: customer_fiscal_entities_data_response
              allOf: 
              - $ref: './customer_fiscal_entities_request.yml'
              - type: object
                required:
                  - id
                  - object
                  - created_at
                properties:
                  id:
                    type: string
                    example: "ship_cont_2tKZsTYcsryyu7Ah8"
                  object:
                    type: string
                    example: "shipping_contact"
                  created_at:
                    type: integer
                    format: int64
                    example: 1675715413
                  parent_id:
                    type: string
                    example: "cus_2tKcHxhTz7xU5SymF"
                  default:
                    type: boolean
  
  shipping_contacts:
    allOf:
       - $ref: ../../schemas/pagination/pagination.yml
       - type: object
         properties:
          data:
            type: array
            items:
              title: customer_shipping_contacts_data_response
              allOf: 
                - $ref: './customer_shipping_contacts.yml'
                - type: object
                  required:
                    - id
                    - object
                    - created_at
                  properties:
                    id:
                      type: string
                      example: "ship_cont_2tKZsTYcsryyu7Ah8"
                    object:
                      type: string
                      example: "shipping_contact"
                    created_at:
                      type: integer
                      format: int64
                      example: 1675715413