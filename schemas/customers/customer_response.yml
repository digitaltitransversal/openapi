title: customer_response
description: customer response
type: object
required:
  - id
  - livemode
  - created_at
  - object
  - name
properties:
  antifraud_info:
    title: customer_antifraud_info_response
    type: object
    nullable: true
    properties:
      first_paid_at:
        type: integer
        format: int64
        nullable: true
        example: 1485151007
      account_created_at:
        type: integer
        format: int64
        nullable: true
        example: 1484040996

  corporate:
    type: boolean
    description: true if the customer is a company

  created_at:
    type: integer
    format: int64
    example: 1485151007
    description: Creation date of the object

  custom_reference:
    type: string
    example: "custom_reference"
    description: Custom reference

  default_fiscal_entity_id:
    type: string
    nullable: true
    example: "fis_ent_2tKqqAfqPi21oCmEJ"

  default_shipping_contact_id:
    type: string
    nullable: true
    example: "ship_cont_2tKZsTYcsryyu7Ah8"

  default_payment_source_id:
    type: string
    nullable: true
    example: "src_2tHJfJ79KyUwpxTio"

  email:
    type: string
    example: "Felipe@gmail.com"
    format: email

  fiscal_entities:
    title: customer_fiscal_entities_response
    allOf:
      - $ref: ../../schemas/pagination/pagination.yml
      - $ref: ../../schemas/pagination/page.yml
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: "./customer_fiscal_entities_response.yml"

  id:
    type: string
    example: "cus_2tHJfJ79KyUwpxTik"
    description: Customer's ID

  livemode:
    type: boolean
    example: true
    description: true if the object exists in live mode or the value false if the object exists in test mode

  name:
    type: string
    example: "Felipe"
    description: Customer's name

  metadata:
    type: object
    additionalProperties: true
    maxProperties: 100

  object:
    type: string
    enum: ["customer"]
    example: "customer"

  payment_sources:
    title: customer_payment_methods_response
    allOf:
      - $ref: ../../schemas/pagination/pagination.yml
      - $ref: ../../schemas/pagination/page.yml
      - type: object
        title: customerPaymentMethods
        properties:
          data:
            type: array
            title: customer_payment_methods_data
            items:
              title: customer_payment_methods_data
              discriminator:
                propertyName: type
                mapping:
                  cash: "./customer_payment_method_cash_response.yml"
                  oxxo_recurrent: "./customer_payment_method_cash_response.yml"
              oneOf:
                - $ref: "./customer_payment_method_cash_response.yml"

  phone:
    type: string
    example: "+5215555555555"
    description: Customer's phone number

  shipping_contacts:
    allOf:
      - $ref: ../../schemas/pagination/pagination.yml
      - $ref: ../../schemas/pagination/page.yml
      - type: object
        properties:
          data:
            type: array
            items:
              title: customer_shipping_contacts_data_response
              allOf:
                - $ref: "./customer_shipping_contacts.yml"
                - type: object
                  required:
                    - id
                    - object
                    - created_at
                  properties:
                    id:
                      type: string
                      example: "ship_cont_2tKZsTYcsryyu7Ah8"
                    object:
                      type: string
                      example: "shipping_contact"
                    created_at:
                      type: integer
                      format: int64
                      example: 1675715413