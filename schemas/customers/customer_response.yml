title: customer_response
description: customer response
type: object
required:
  - id
  - livemode
  - created_at
  - object
properties:
  id:
    type: string
    example: "cus_2tHJfJ79KyUwpxTik"
    description: Customer's ID

  object:
    type: string
    enum: ["customer"]
    example: "customer"

  created_at:
    type: integer
    format: int64
    example: 1485151007
    description: Creation date of the object (Unix timestamp)

  livemode:
    type: boolean
    example: true
    description: true if the object exists in live mode or false if the object exists in test mode

  name:
    type: string
    nullable: true
    example: "Felipe"
    description: Customer's name

  email:
    type: string
    nullable: true
    example: "felipe@gmail.com"
    format: email

  phone:
    type: string
    nullable: true
    example: "+5215555555555"
    description: Customer's phone number

  corporate:
    type: boolean
    description: true if the customer is a company
    example: false

  custom_reference:
    type: string
    nullable: true
    example: "custom_reference"
    description: Custom reference

  referrer:
    type: string
    nullable: true
    description: Referrer information (if available)

  vertical_info:
    type: object
    nullable: true
    additionalProperties: true
    description: Vertical-specific information (shape depends on integration)

  default_fiscal_entity_id:
    type: string
    nullable: true
    example: "fis_ent_2tKqqAfqPi21oCmEJ"

  default_shipping_contact_id:
    type: string
    nullable: true
    example: "ship_cont_2tKZsTYcsryyu7Ah8"

  metadata:
    type: object
    nullable: true
    additionalProperties: true
    maxProperties: 100
    description: Customer metadata (maps to contextual_data in backend)

  payment_sources:
    title: customer_payment_methods_response
    allOf:
      - $ref: ../../schemas/pagination/pagination.yml
      - $ref: ../../schemas/pagination/page.yml
      - type: object
        title: customerPaymentMethods
        properties:
          data:
            type: array
            title: customer_payment_methods_data
            items:
              title: customer_payment_methods_data
              discriminator:
                propertyName: type
              oneOf:
                - $ref: "./customer_payment_method_cash_response.yml"
