title: charge_response
type: object
required:
  - id
  - object
  - amount
  - currency
  - status
  - livemode
  - created_at
  - payment_method
properties:
  id:
    type: string
    example: "696a682e1ef5ca00015698b7"

  livemode:
    type: boolean
    example: true

  created_at:
    type: integer
    format: int64
    example: 1768581166

  currency:
    type: string
    example: "MXN"

  failure_code:
    type: string
    nullable: true
    example: null

  failure_message:
    type: string
    nullable: true
    example: null

  channel:
    type: object
    properties:
      segment:
        type: string
        example: "Checkout"
      checkout_request_id:
        type: string
        example: "f3a5bfc1-ba1c-474f-9687-46d8b75ffc90"
      checkout_request_type:
        type: string
        example: "Integration"
      id:
        type: string
        example: "channel_2zNxD65G8MBNkYksy"

  payment_method:
    title: charge_response_payment_method
    oneOf:
      - $ref: "./charge_payment_method_cash_response.yml#/payment_method_cash"
    discriminator:
      propertyName: object

  object:
    type: string
    enum: ["charge"]
    example: "charge"

  device_fingerprint:
    type: string
    example: "6FR3chaU4Y1nGAW5NAGd1rcjAKa142Ba"

  description:
    type: string
    example: "Payment from order"

  is_refundable:
    type: boolean
    example: false

  reference_id:
    type: string
    nullable: true
    example: null

  status:
    type: string
    example: "expired"

  amount:
    type: integer
    format: int64
    example: 600000

  paid_at:
    type: integer
    format: int64
    nullable: true
    example: null

  customer_id:
    type: string
    example: ""

  order_id:
    type: string
    example: "ord_2zNwzJrfNC24uQUzq"

  refunds:
    type: object
    title: charge_response_refunds
    nullable: true
    allOf:
      - $ref: ../pagination/pagination.yml
      - $ref: ../pagination/page.yml
      - type: object
        properties:
          data:
            description: refunds
            type: array
            items:
              title: charge_response_refunds_data
              type: object
              required:
                - object
                - id
                - amount
                - created_at
              properties:
                amount:
                  type: integer
                  format: int64
                  example: -15000
                auth_code:
                  type: string
                  nullable: true
                  example: "867372"
                created_at:
                  type: integer
                  format: int64
                  example: 1678226878
                expires_at:
                  type: integer
                  format: int64
                  nullable: true
                  example: 1678226878
                  description: refund expiration date
                id:
                  type: string
                  example: "6407b5bee1329a000175ba11"
                object:
                  type: string
                  enum: ["refund"]
                  example: "refund"
                status:
                  type: string
                  nullable: true
                  example: "pending"
                  description: refund status
                payout_id:
                  type: string
                  nullable: true
                  example: "6fca054a-8519-4c43-971e-cea35cc519bb"
                reference:
                  type: string
                  nullable: true
                  example: "12002000778626"
                  description: payout reference for oxxo stores