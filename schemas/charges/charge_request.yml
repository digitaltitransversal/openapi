title: charges
type: object
description: The charges to be made
required:
  - payment_method
properties:
  amount:
    type: integer
    example: 40000

  payment_method:
    type: object
    description: >
      Payment method used in the charge.
    required:
      - type
    properties:
      type:
        type: string
        description: Payment method type.
        example: cash
        enum:
          - cash
          - oxxo_cash
          
      expires_at:
        type: integer
        format: int64
        description: Method expiration date as unix timestamp (applies to some payment methods, e.g. cash).
        example: 1789928542
        nullable: true

      payment_source_id:
        type: string
        description: Identifier of a saved payment source to be used for this charge (if applicable).
        example: "src_2tLkkyfMPh6v7pFry"
        nullable: true

  reference_id:
    type: string
    description: Custom reference to add to the charge
    example: "ref_2tN73UdUSNrYRPD9r"
    nullable: true