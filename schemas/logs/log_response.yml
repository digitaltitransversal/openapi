title: log_response
description: Log model representing a recorded request/response cycle for troubleshooting and auditing.
type: object
required:
  - id
  - object
  - created_at
  - livemode
properties:
  id:
    type: string
    example: "6307a60c41de27127515a575"

  object:
    type: string
    enum: ["log"]
    example: "log"

  created_at:
    type: integer
    format: int64
    example: 1661445644

  updated_at:
    type: string
    format: date-time
    example: "2022-08-25T16:40:44.887Z"

  livemode:
    type: boolean
    example: true

  ip_address:
    type: string
    format: ipv4
    example: "54.235.131.48"

  loggable_id:
    type: string
    nullable: true
    example: "ord_87632467832"

  loggable_type:
    type: string
    nullable: true
    example: "order"

  method:
    type: string
    example: "POST"

  url:
    type: string
    example: "/filter_resource"

  related:
    type: string
    example: "FilterResource"

  version:
    type: string
    example: "2.2.0"

  user_account_id:
    type: string
    nullable: true
    example: "5a0b7001edbb6e1725b0b2c6"

  oauth_token_id:
    type: string
    nullable: true
    example: null

  status:
    type: string
    example: "200"

  query_string:
    type: object
    nullable: true
    additionalProperties: true
    example:
      amount: 3000
      payable: true

  request_headers:
    type: object
    nullable: true
    additionalProperties:
      type: string

  response_headers:
    type: object
    nullable: true
    additionalProperties:
      type: string

  request_body:
    type: object
    nullable: true
    additionalProperties: true

  response_body:
    type: object
    nullable: true
    additionalProperties: true

  searchable_tags:
    type: array
    items:
      type: string
    example:
      - "6307a60c41de27127515a575"
      - "6307a60c41de27127515a571"