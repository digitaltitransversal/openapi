title: log_response
description: Log model representing a recorded request/response cycle for troubleshooting and auditing.
type: object
required:
  - id
  - object
  - created_at
  - livemode
  - method
  - url
  - status
  - version
  - ip_address
  - related
properties:
  id:
    type: string
    example: "696139685c96a70001d67e1a"
  object:
    type: string
    enum: ["log"]
    example: "log"
  created_at:
    type: integer
    format: int64
    example: 1767979368
  livemode:
    type: boolean
    example: true

  method:
    type: string
    example: "GET"
  url:
    type: string
    example: "/events"
  status:
    type: string
    example: "200"
  version:
    type: string
    example: "2.1.0"
  ip_address:
    type: string
    format: ipv4
    example: "54.86.50.139"
  related:
    type: string
    example: "Event"

  query_string:
    type: object
    nullable: true
    additionalProperties: true
    example:
      limit: "20"

  request_body:
    type: object
    nullable: true
    additionalProperties: true
    example: {}

  response_body:
    type: object
    nullable: true
    additionalProperties: true

  request_headers:
    type: object
    nullable: true
    additionalProperties:
      type: string

  response_headers:
    type: object
    nullable: true
    additionalProperties:
      type: string

  searchable_tags:
    type: array
    items:
      type: string