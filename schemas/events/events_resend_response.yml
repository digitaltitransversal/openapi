title: event_webhook_resend_response
description: Webhook log model returned after resending an event webhook delivery.
type: object
required:
  - id
  - url
  - failed_attempts
  - last_http_response_status
  - response_data
  - last_attempted_at
properties:
  failed_attempts:
    type: integer
    example: 2
  id:
    type: string
    example: "webhl_2zPzadKdcLpBVnWC2"
  last_attempted_at:
    type: integer
    example: 1768856284
  last_http_response_status:
    type: integer
    example: 405
  response_data:
    type: object
    additionalProperties: true
    maxProperties: 100
    example: {}
  url:
    type: string
    format: uri
    example: "https://example.com/new-webhooks"