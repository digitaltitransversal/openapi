title: event_response
description: event model
type: object
required:
  - id
  - object
  - created_at
  - livemode
  - type
  - data
  - webhook_status
  - webhook_logs
properties:
  created_at:
    type: integer
    format: int64
    example: 1661445644

  data:
    type: object
    additionalProperties: true
    maxProperties: 100
    example:
      data:
        object:
          action: "ping"
          livemode: true
        previous_attributes: {}

  id:
    type: string
    example: "6307a60c41de27127515a575"

  livemode:
    type: boolean
    example: true

  object:
    type: string
    enum: ["event"]
    example: "event"

  type:
    type: string
    example: "webhook_ping"

  webhook_logs:
    type: array
    items:
      type: object
      title: WebhookLog
      required:
        - id
        - url
        - failed_attempts
        - last_http_response_status
        - last_attempted_at
      properties:
        failed_attempts:
          type: integer
          example: 10
        id:
          type: string
          example: "webhl_2svd2sh6GbqzyWBNZ"
        last_attempted_at:
          type: integer
          format: int64
          example: 1669651274
        last_http_response_status:
          type: integer
          example: 200
        object:
          type: string
          enum: ["webhook_log"]
          example: "webhook_log"
        response_data:
          type: object
          nullable: true
          additionalProperties: true
          maxProperties: 100
          example:
            amount: 3000
            payable: true
        url:
          type: string
          format: uri
          example: "https://username:password@mockoon.stg.femsa.io/payments-api/cash/merchant_approval"

  webhook_status:
    type: string
    example: "successful"