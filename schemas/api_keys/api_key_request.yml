title: api_keys_request
name: api_keys_request
required:
  - role
properties:
  description:
    type: string
    description: A name or brief explanation of what this API key is used for.
    example: online store

  role:
    type: string
    description: >
      Defines the type of API key to create. Only "private" is supported for creation.
      A "public" API key already exists by default per company/environment.
    enum:
      - private
    example: private