title: line_item_response
type: object
description: Line item response.
properties:
  id:
    type: string
    example: "line_item_1234567890"
  object:
    type: string
    example: "line_item"
  name:
    type: string
    example: "Box of Cohiba S1s"
  description:
    type: string
    nullable: true
    example: null
  sku:
    type: string
    nullable: true
    example: "SKU-001"
  unit_price:
    type: integer
    format: int64
    example: 20000
  quantity:
    type: integer
    example: 1
  tags:
    type: array
    items:
      type: string
    nullable: true
  metadata:
    type: object
    additionalProperties: true
    maxProperties: 100
    nullable: true
