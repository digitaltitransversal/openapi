type: object
title: update_product
properties:
  name:
    type: string
    example: "Box of Cohiba S1s"

  unit_price:
    type: integer
    format: int64
    example: 20000
    minimum: 0

  quantity:
    type: integer
    format: int32
    example: 1
    minimum: 1

  sku:
    type: string

  brand:
    type: string

  description:
    type: string
    maxLength: 250

  tags:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 2
      maxLength: 249

  metadata:
    type: object
    additionalProperties: true
    maxProperties: 100