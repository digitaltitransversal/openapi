title: order_update
description: Order update payload. Only supported fields can be modified.
type: object
properties:
  status:
    type: string
    description: Order status update. Allowed values depend on server-side validations.

  currency:
    type: string
    description: >-
      Currency with which the payment will be made. It uses the 3-letter code of the International Standard ISO 4217.
    example: "MXN"
    maxLength: 3

  customer_info:
    oneOf:
      - $ref: ../customers/customer_info.yml
      - $ref: ../customers/customer_info_just_customer_id.yml

  line_items:
    description: List of [products](https://developers.digitalfemsa.io/reference/orderscreateproduct) sold in the order. 
    type: array
    items:
      $ref: product.yml

  shipping_lines:
    type: array
    description: List of [shipping costs](https://developers.digitalfemsa.io/reference/orderscreateshipping) applied to the order.
    items:
      $ref: ../../schemas/orders/shipping_request.yml

  tax_lines:
    type: array
    items:
      $ref: order_tax_request.yml

  discount_lines:
    description: List of [discounts](https://developers.digitalfemsa.io/reference/orderscreatediscountline) applied to the order.
    type: array
    items:
      $ref: order_discount_lines_request.yml

  metadata:
    type: object
    additionalProperties: true
    description: Additional information attached to the order.

  return_url:
    type: string
    description: URL to redirect the customer after completing the flow (when applicable).
    example: "https://example.com/return"

  charges:
    type: array
    description: |
      Charges update. Subject to server-side validations (for example, max charges rules).
    items:
      $ref: ../../schemas/charges/charge_request.yml

  shipping_contact_id:
    type: string
    nullable: true
    description: References an existing customer shipping contact.

  shipping_contact:
    $ref: ../../schemas/customers/customer_shipping_contacts.yml

  fiscal_entity_id:
    type: string
    nullable: true
    description: References an existing customer fiscal entity.

  fiscal_entity:
    title: order_update_fiscal_entity_request
    type: object
    description: Fiscal entity information associated with the order.
    required:
      - address
    properties:
      address:
        $ref: fiscal_entity_address.yml
      email:
        type: string
        example: "test@gmail.com"
        description: Email of the fiscal entity
      name:
        type: string
        example: "Femsa Inc"
        nullable: true
        description: Name of the fiscal entity
      metadata:
        type: object
        additionalProperties: true
        maxProperties: 100
        description: Metadata associated with the fiscal entity
      phone:
        type: string
        example: "+525511223344"
        description: Phone of the fiscal entity
      tax_id:
        type: string
        example: "AAA010101AAA"
        nullable: true
        description: Tax ID of the fiscal entity