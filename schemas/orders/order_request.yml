title: a order
description: a order
type: object
required:
  - currency
  - customer_info
  - line_items
properties:
  properties:
  currency:
    type: string
    description: >-
       Currency with which the payment will be made.
    example: "MXN"
    maxLength: 3

  customer_info:
    description: "Customer information"
    oneOf:
      - $ref: ../customers/customer_info.yml
      - $ref: ../customers/customer_info_just_customer_id.yml

  line_items:
    description: "List of [products](https://developers.digitalfemsa.io/reference/orderscreateproduct) that are sold in the order. You must have at least one product."
    type: array
    items:
      $ref: product.yml

  charges:
    description: "List of [charges](https://developers.digitalfemsa.io/reference/orderscreatecharge) that are applied to the order"
    type: array
    items:
      $ref: ../../schemas/charges/charge_request.yml

  checkout:
    description: Checkout configuration to create/link a checkout for this order. Cannot be sent together with `charges`.
    $ref: ../../schemas/checkouts/checkout_request.yml

  discount_lines:
    description: "List of [discounts](https://developers.digitalfemsa.io/reference/orderscreatediscountline) that are applied to the order. You must have at least one discount."
    type: array
    items:
      $ref: order_discount_lines_request.yml

  tax_lines:
    description: "List of [taxes](https://developers.digitalfemsa.io/reference/orderscreatetaxes) that are applied to the order."
    type: array
    items:
      $ref: order_tax_request.yml

  needs_shipping_contact:
    type: boolean
    example: false
    description: Allows you to fill out the shipping information at checkout

  shipping_contact:
    $ref: ../../schemas/customers/customer_shipping_contacts.yml

  shipping_lines:
    description: "List of [shipping costs](https://developers.digitalfemsa.io/reference/orderscreateshipping). If the online store offers digital products."
    type: array
    items:
      $ref: ../../schemas/orders/shipping_request.yml

  fiscal_entity:
    title: order_fiscal_entity_request
    type: object
    description: "Fiscal entity of the order, Currently it is a purely informative field"
    required:
      - address
    properties:
      address:
        $ref: fiscal_entity_address.yml
      email:
        type: string
        description: "Email of the fiscal entity"
      metadata:
        type: object
        additionalProperties: true
        maxProperties: 100
        description: "Metadata associated with the fiscal entity"
      name:
        type: string
        nullable: true
        description: "Name of the fiscal entity"
      phone:
        type: string
        description: "Phone of the fiscal entity"
      tax_id:
        type: string
        nullable: true
        description: "Tax ID of the fiscal entity"

  processing_mode:
    type: string
    description: "Indicates the processing mode for the order, either ecommerce, recurrent or validation."
    example: "ecommerce"

  metadata:
    type: object
    additionalProperties: true
    maxProperties: 100
    description: >
      Arbitrary key-value data that you can attach to the order for your internal use
      (e.g. `customer_segment`, `sales_channel`, `internal_order_id`). It is not used for
      payment processing or fraud decisions. Keys should be strings; values can be any JSON value.