title: order_response
description: |
  Order model.
  Some nested resources are returned as list previews (for example: `charges`, `line_items`), and may be `null` depending on the request/context.
  The `checkout` field is only present when the order is linked to a checkout (`channel.checkout_request_id`).
type: object
required:
  - id
  - object
  - livemode
  - amount
  - currency
  - payment_status
  - amount_refunded
  - created_at
  - updated_at
properties:
  id:
    type: string
    example: "ord_2zKSF2aUY2kBRcyXJ"

  object:
    type: string
    enum: ["order"]
    example: "order"

  livemode:
    type: boolean
    example: true

  amount:
    type: integer
    example: 10000

  currency:
    type: string
    maxLength: 3
    example: "MXN"

  payment_status:
    description: Current payment status of the order. It can be `null` for orders without payment information yet.
    type: string
    nullable: true
    example: "pending_payment"

  amount_refunded:
    type: integer
    example: 0

  split_payment:
    description: Indicates whether the order uses split payments (when available/configured).
    type: boolean
    nullable: true

  metadata:
    description: Metadata attached to the order.
    type: object
    additionalProperties: true
    maxProperties: 100
    example: {}

  is_refundable:
    description: Indicates whether the order is currently refundable.
    type: boolean
    example: false

  created_at:
    type: integer
    format: int64
    example: 1767651766

  updated_at:
    type: integer
    format: int64
    example: 1767651766

  customer_info:
    description: Customer information associated with the order.
    $ref: ../customers/customer_info_response.yml

  shipping_contact:
    description: Shipping contact associated with the order. It may be `null` when not provided/required.
    nullable: true
    $ref: ../customers/customer_shipping_contacts_response.yml

  channel:
    description: Channel information for the order (for example Checkout-related metadata). It may be `null`.
    nullable: true
    $ref: ../channels/channel_response.yml

  fiscal_entity:
    description: Fiscal entity information associated with the order. This field can be `null`.
    nullable: true
    $ref: ../fiscal_entities/fiscal_entity_response.yml

  checkout:
    description: Checkout resource linked to the order. Present only when the order is linked to a checkout (`channel.checkout_request_id`).
    nullable: true
    $ref: ../checkouts/checkout_response.yml

  is_button_premia:
    description: Indicates whether the order is associated with Button Premia (when applicable).
    type: boolean
    nullable: true

  line_items:
    description: List preview of line items included in the order. It can be `null` depending on the response context.
    nullable: true
    type: object
    required: [object, has_more, data]
    properties:
      object:
        type: string
        enum: ["list"]
        example: "list"
      has_more:
        type: boolean
        example: false
      total:
        type: integer
        nullable: true
        example: 1
      data:
        type: array
        items:
          $ref: ../orders/line_item_response.yml

  shipping_lines:
    description: List preview of shipping lines for the order. It can be `null` when not applicable or not included.
    nullable: true
    type: object
    required: [object, has_more, data]
    properties:
      object:
        type: string
        enum: ["list"]
        example: "list"
      has_more:
        type: boolean
        example: false
      total:
        type: integer
        nullable: true
      data:
        type: array
        items:
          $ref: ../orders/shipping_line_response.yml

  tax_lines:
    description: List preview of tax lines for the order. It can be `null` when not applicable or not included.
    nullable: true
    type: object
    required: [object, has_more, data]
    properties:
      object:
        type: string
        enum: ["list"]
        example: "list"
      has_more:
        type: boolean
        example: false
      total:
        type: integer
        nullable: true
      data:
        type: array
        items:
          $ref: ../orders/tax_line_response.yml

  discount_lines:
    description: List preview of discount lines applied to the order. It can be `null` when not applicable or not included.
    nullable: true
    type: object
    required: [object, has_more, data]
    properties:
      object:
        type: string
        enum: ["list"]
        example: "list"
      has_more:
        type: boolean
        example: false
      total:
        type: integer
        nullable: true
      data:
        type: array
        items:
          $ref: ../orders/discount_line_response.yml

  charges:
    description: |
      List preview of charges created for the order.
      Charges are only created when included in the request or created later through payment flows.
      This field can be `null` depending on the response context.
    nullable: true
    type: object
    required: [object, has_more, data]
    properties:
      object:
        type: string
        enum: ["list"]
        example: "list"
      has_more:
        type: boolean
        example: false
      total:
        type: integer
        nullable: true
        example: 1
      data:
        type: array
        items:
          $ref: ../charges/charge_response.yml

  partial_reference:
    description: Partial reference information (when applicable). Structure may vary depending on the payment flow.
    nullable: true
    type: object
    additionalProperties: true

  payments_info:
    description: Additional payment information (when available). Structure may vary.
    nullable: true
    type: object
    additionalProperties: true