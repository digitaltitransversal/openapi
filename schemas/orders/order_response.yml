title: order_response
description: |
  Order model.
  Some nested resources are returned as list previews (for example: `charges`, `line_items`), and may be `null` depending on the request/context.
  The `checkout` field is only present when the order is linked to a checkout (`channel.checkout_request_id`).
properties:
  id:
    type: string
    example: "ord_2zKSF2aUY2kBRcyXJ"

  object:
    type: string
    enum: ["order"]
    example: "order"

  livemode:
    type: boolean
    example: true

  amount:
    type: integer
    example: 10000

  currency:
    type: string
    maxLength: 3
    example: "MXN"

  payment_status:
    description: Current payment status of the order. It can be `null` for orders without payment information yet.
    type: string
    nullable: true
    example: "pending_payment"

  amount_refunded:
    type: integer
    example: 0

  split_payment:
    description: Indicates whether the order uses split payments (when available/configured).
    type: boolean
    nullable: true

  metadata:
    description: Metadata attached to the order.
    type: object
    additionalProperties: true
    maxProperties: 100
    example: {}

  is_refundable:
    description: Indicates whether the order is currently refundable.
    type: boolean
    example: false

  created_at:
    type: integer
    format: int64
    example: 1767651766

  updated_at:
    type: integer
    format: int64
    example: 1767651766

  customer_info:
    description: Customer information associated with the order.
    allOf:
      - type: object
        properties:
          object:
            type: string
            example: "customer_info"
      - $ref: order_customer_info_response.yml
      - $ref: ../customers/customer_info_just_customer_id_response.yml

  shipping_contact:
    description: Shipping contact associated with the order. It may be `null` when not provided/required.
    nullable: true
    allOf:
      - type: object
        properties:
          created_at:
            type: integer
            format: int64
          id:
            type: string
          object:
            type: string
      - $ref: ../../schemas/customers/customer_shipping_contacts_response.yml

  channel:
    description: Channel information for the order (for example Checkout-related metadata). It may be `null`.
    nullable: true
    type: object
    properties:
      segment:
        type: string
        example: "Checkout"
      checkout_request_id:
        type: string
        example: "6fca054a-8519-4c43-971e-cea35cc519bb"
      checkout_request_type:
        type: string
        example: "HostedPayment"
      id:
        type: string
        example: "channel_2tNDzhA4Akmzj11AU"

  fiscal_entity:
    title: order_fiscal_entity_response
    description: Fiscal entity information associated with the order. This field can be `null`.
    type: object
    nullable: true
    required:
      - address
      - id
      - object
      - created_at
    properties:
      address:
        title: order_fiscal_entity_address_response
        description: "Address of the fiscal entity"
        allOf:
          - $ref: fiscal_entity_address.yml
          - type: object
            properties:
              object:
                type: string
                example: "fiscal_entity_address"
      email:
        type: string
        example: "test@gmail.com"
        description: "Email of the fiscal entity"
        nullable: true
      metadata:
        type: object
        additionalProperties: true
        maxProperties: 100
        description: "Metadata associated with the fiscal entity"
      name: 
        type: string
        example: "Femsa Inc"
        nullable: true
        description: "Name of the fiscal entity"
      tax_id:
        type: string
        example: "324234234"
        description: "Tax ID of the fiscal entity"
        nullable: true
      id:
        type: string
        example: "fis_ent_2tN85VYaSMyDvjB3M"
        description: "ID of the fiscal entity"
      created_at:
        type: integer
        format: int64
        example: 1676328434
        description: "The time at which the object was created in seconds since the Unix epoch"
      object:
        type: string
        example: "fiscal_entity"
      phone:
        type: string
        example: "+525511223344"
        description: "Phone of the fiscal entity"
        nullable: true

  checkout:
    type: object
    description: Checkout resource linked to the order. Present only when the order is linked to a checkout (`channel.checkout_request_id`).
    properties:
      allowed_payment_methods:
        type: array
        items:
          type: string
      can_not_expire:
        type: boolean
        example: false
      emails_sent:
        type: integer
        example: 0
      expires_at:
        type: integer
        example: 1676613599
        format: int64
      failure_url:
        type: string
        example: "http://187.216.228.66:2222/SysVentasPagos/Acceso.aspx"
      id:
        type: string
        example:  "6fca054a-8519-4c43-971e-cea35cc519bb"
      is_redirect_on_failure:
        type: boolean
        example: false
      livemode:
        type: boolean
        example: false
      metadata:
        additionalProperties: true
        maxProperties: 100
        type: object
      name:
        type: string
        example: "ord-2tNDzhA4Akmzj11AS"
      needs_shipping_contact:
        type: boolean
        example: false
      object:
        type: string
        example: "checkout"
      on_demand_enabled:
        type: boolean
        example: true
        nullable: true
      recurrent:
        type: boolean
        example: false
      slug:
        type: string
        example:  "6fca054a85194c43971ecea35cc519bb"
      sms_sent: 
        type: integer
        example: 0
      success_url:
        type: string
        example: "http://187.216.228.66:2222/SysVentasPagos/Acceso.aspx"
      starts_at:
        type: integer
        example: 1676354400
      status:
        type: string
        example: "Issued"
      type:
        type: string
        example: "HostedPayment"
      url:
        type: string
        example: "https://pay.stg.femsa.io/checkout/6fca054a85194c43971ecea35cc519bb"

  line_items:
    title: order_response_products
    allOf:
      - $ref: ../pagination/pagination.yml
      - $ref: ../pagination/page.yml
      - type: object
        properties:
          data:
            type: array
            items:
              title: product_data_response
              allOf:
                - $ref: product.yml
                - type: object
                  properties:
                    id: 
                      type: string
                    object:
                      type: string
                    parent_id:
                      type: string

  discount_lines:
    allOf:
      - $ref: ../pagination/pagination.yml
      - type: object
        properties:
          data:
            type: array
            items:
              title: discount_lines_data_response
              allOf:
                - $ref: ../../schemas/orders/discount_lines_response.yml

  charges:
    description: |
      List preview of charges created for the order.
      Charges are only created when included in the request or created later through payment flows.
      This field can be `null` depending on the response context.
    allOf:
      - $ref: ../pagination/pagination.yml
      - type: object
        properties:
          data:
            type: array
            items:
              title: charges_data_response
              allOf:
                - $ref: ../../schemas/charges/charge_response.yml

  partial_reference:
    description: Partial reference information (when applicable). Structure may vary depending on the payment flow.
    nullable: true
    type: object
    additionalProperties: true

  payments_info:
    description: Additional payment information (when available). Structure may vary.
    nullable: true
    type: object
    additionalProperties: true