title: update_order_tax_request
description: Create a new tax line for an existing order.
type: object
properties:
  amount:
    type: integer
    format: int64
    example: 100
    minimum: 0
    description: The amount to be collected for tax in cents
  description:
    type: string
    example: "VAT"
    minLength: 2
    description: Description or tax name
  metadata:
    type: object
    additionalProperties: true
    maxProperties: 100
