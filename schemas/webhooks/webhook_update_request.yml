title: webhook_update_request
description: Parameters used to update a webhook. All fields are optional; send only the fields you want to change.
type: object
properties:
  url:
    type: string
    format: uri
    example: "https://webhook.site/89277eaa-a8e4-4306-8dc5-f55c80703dc8"
    pattern: "^(?!.*(localhost|127\\.0\\.0\\.1)).*$"
    description: Webhook endpoint URL. Local URLs are not allowed.
  subscribed_events:
    type: array
    items:
      type: string
    description: List of event types the webhook is subscribed to.
  events:
    type: array
    items:
      type: string
    deprecated: true
    description: Alias for subscribed_events.
  synchronous:
    type: boolean
    example: false
    default: false
    description: Indicates whether the webhook uses synchronous delivery behavior.
  active:
    type: boolean
    example: true
    description: Activates or deactivates the webhook.
  description:
    type: string
    nullable: true
    example: "My integrations webhook"
    description: Optional description of the webhook.