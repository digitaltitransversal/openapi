title: webhook_response
description: Represents a webhook endpoint configured to receive event notifications.
type: object
required:
  - id
  - object
  - url
  - status
  - subscribed_events
  - synchronous
  - livemode
  - active
properties:
  id:
    type: string
    example: "6307a60c41de27127515a575"
    description: Unique identifier of the webhook.
  object:
    type: string
    example: "webhook"
    description: Object name, which is webhook.
  url:
    type: string
    example: "https://username:password@mockoon.stg.femsa.io/payments-api/cash/merchant_approval"
    description: The URL where events will be delivered.
  status:
    type: string
    example: "listening"
    enum:
      - being_pinged
      - listening
      - intermittent_errors
      - unresponsive
      - error
      - disabled
    description: Current delivery status of the webhook.
  subscribed_events:
    type: array
    items:
      type: string
    example:
      - "charge.created"
      - "charge.paid"
    description: List of event types the webhook is subscribed to.
  synchronous:
    type: boolean
    example: false
    description: Indicates whether the webhook uses synchronous delivery behavior.
  description:
    type: string
    nullable: true
    example: "My integrations webhook"
    description: Optional description of the webhook.
  livemode:
    type: boolean
    example: true
    description: Indicates whether the webhook is in live mode or test mode.
  active:
    type: boolean
    example: true
    description: Indicates whether the webhook is active.