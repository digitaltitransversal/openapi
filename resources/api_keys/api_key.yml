get:
  tags:
    - Api Keys
  operationId: getApiKey
  summary: Get API key
  description: |
    Retrieves the details of an API key by its ID.

  security:
    - bearerAuth: []

  responses:
    "200":
      description: successful
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            $ref: "../../schemas/api_keys/api_key_response.yml"
    "401":
      $ref: "../errors/401.yml"
    "404":
      $ref: "../errors/404.yml"
    "500":
      $ref: "../errors/500.yml"

  parameters:
    - $ref: "../../parameters/commons/path_param/id.yml"
    - $ref: "../../parameters/commons/headers/accept_language.yml"
    - $ref: "../../parameters/commons/headers/x_child_company_id.yml"

put:
  tags:
    - Api Keys
  operationId: updateApiKey
  summary: Update API key
  description: |
    Updates an existing API key by its ID.

    Use this endpoint to change the key's status (active/inactive) or update its description.

  security:
    - bearerAuth: []

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          title: api_key_update_request
          properties:
            active:
              type: boolean
              example: true
              description: Indicates whether the API key is active.
            description:
              type: string
              example: online store
              description: A name or brief explanation of what this API key is used for.

  responses:
    "200":
      description: successful operation
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            $ref: ../../schemas/api_keys/api_key_response.yml
    "401":
      $ref: "../errors/401.yml"
    "404":
      $ref: "../errors/404.yml"
    "422":
      $ref: "../errors/422.yml"
    "500":
      $ref: "../errors/500.yml"

  parameters:
    - $ref: "../../parameters/commons/path_param/id.yml"
    - $ref: "../../parameters/commons/headers/accept_language.yml"
    - $ref: "../../parameters/commons/headers/x_child_company_id.yml"

delete:
  tags:
    - Api Keys
  operationId: deleteApiKey
  summary: Delete API key
  description: |
    Deletes an API key by its ID.

  security:
    - bearerAuth: []

  responses:
    "200":
      description: successful
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            title: delete_api_keys_response
            allOf:
              - $ref: "../../schemas/api_keys/api_key_response_on_delete.yml"
              - type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
    "401":
      $ref: "../errors/401.yml"
    "404":
      $ref: "../errors/404.yml"
    "422":
      $ref: "../errors/422.yml"
    "500":
      $ref: "../errors/500.yml"

  parameters:
    - $ref: "../../parameters/commons/path_param/id.yml"
    - $ref: "../../parameters/commons/headers/accept_language.yml"
    - $ref: "../../parameters/commons/headers/x_child_company_id.yml"