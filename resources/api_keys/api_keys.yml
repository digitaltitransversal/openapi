get:
  tags:
    - Api Keys
  operationId: getApiKeys
  summary: List API keys
  description: |
    Retrieves a paginated list of API keys for the authenticated account.

    Use the pagination parameters (`limit`, `next_page`, `previous_page`) to navigate through results.
    Use the `search` query parameter to perform a general search (for example by key `id` or description).

  security:
    - bearerAuth: []

  responses:
    200:
      description: successful
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            title: get_api_keys_response
            allOf:
              - $ref: ../../schemas/pagination/page.yml
              - $ref: ../../schemas/pagination/pagination.yml
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../schemas/api_keys/api_key_response.yml'
    401:
      $ref: '../errors/401.yml'
    500:
      $ref: '../errors/500.yml'

  parameters:
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'
    - $ref: '../../parameters/commons/query/limit.yml'
    - $ref: '../../parameters/commons/query/next_page.yml'
    - $ref: '../../parameters/commons/query/previous_page.yml'
    - description: "General search, e.g. by id, description, prefix"
      in: query
      name: search
      required: false
      schema:
        type: string
post:
  tags:
    - Api Keys
  operationId: createApiKey
  summary: Create API key
  description: |
    Creates a new API key.

    The response includes an `authentication_token` that is shown only once (at creation time).
    Copy and store it securely.

  security:
    - bearerAuth: []

  requestBody:
    $ref: ../../requestBodies/api_keys/api_keys_create.yml

  responses:
    200:
      description: successful operation
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            title: api_key_create_response
            allOf:
              - type: object
                properties:
                  authentication_token:
                    type: string
                    example: key_rpHzxufNgjFCdprEEFZRTKi
                    description: >
                      Used as the username for Basic Authentication, with a blank password.
                      This value is shown only once (when the key is created). Copy and store it securely.
              - $ref: ../../schemas/api_keys/api_key_response.yml
    401:
      $ref: '../errors/401.yml'
    422:
      $ref: '../errors/422.yml'
    500:
      $ref: '../errors/500.yml'

  parameters:
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'