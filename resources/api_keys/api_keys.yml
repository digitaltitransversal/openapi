get:
  tags:
    - Api Keys
  operationId: getApiKeys
  summary: Get list of Api Keys
  description: Consume the list of API keys you have.
  security:
    - basicAuth: []
  responses:
    "200":
      description: successful
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            title: get_api_keys_response
            allOf:
              - $ref: ../../schemas/pagination/page.yml
              - $ref: ../../schemas/pagination/pagination.yml
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "../../schemas/api_keys/api_key_response.yml"
    "401":
      $ref: "../errors/401.yml"
    "500":
      $ref: "../errors/500.yml"
  parameters:
    - $ref: "../../parameters/commons/headers/accept_language.yml"
    - $ref: "../../parameters/commons/headers/x_child_company_id.yml"
    - $ref: "../../parameters/commons/query/limit.yml"
    - $ref: "../../parameters/commons/query/next_page.yml"
    - $ref: "../../parameters/commons/query/previous_page.yml"
    - description: General search, e.g. by id, description, prefix
      in: query
      name: search
      required: false
      schema:
        type: string
post:
  tags:
    - Api Keys
  operationId: createApiKey
  summary: Create Api Key
  description: Create an API key.
  security:
    - basicAuth: []
  requestBody:
    $ref: "../../requestBodies/api_keys/api_keys_create.yml"
  responses:
    "200":
      description: successful operation
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            title: api_key_create_response
            allOf:
              - type: object
                properties:
                authentication_token:
                  type: string
                  example: key_rpHzxufNgjFCdprEEFZRTKi
                  writeOnly: true
                  description: >
                    Used as the username for Basic Authentication, with a blank password.
                    This value is shown only once (when the key is created). Copy and store it securely.             
              - $ref: "../../schemas/api_keys/api_key_response.yml"
    "401":
      $ref: "../errors/401.yml"
    "422":
      $ref: "../errors/422.yml"
    "500":
      $ref: "../errors/500.yml"
  parameters:
    - $ref: "../../parameters/commons/headers/accept_language.yml"
    - $ref: "../../parameters/commons/headers/x_child_company_id.yml"