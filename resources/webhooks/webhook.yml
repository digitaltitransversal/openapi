get:
  tags:
    - Webhooks
  operationId: getWebhook
  summary: Get webhook
  description: Retrieves the details of a webhook by its ID.

  security:
    - bearerAuth: []

  responses:
    200:
      description: successful operation
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            $ref: '../../schemas/webhooks/webhook_response.yml'
    401:
      $ref: '../errors/401.yml'
    404:
      $ref: '../errors/404.yml'
    500:
      $ref: '../errors/500.yml'
  
  parameters:
    - $ref: '../../parameters/commons/path_param/id.yml'
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'

put:
  tags:
    - Webhooks
  operationId: updateWebhook
  summary: Update webhook
  description: Updates an existing webhook.

  security:
    - bearerAuth: []

  requestBody:
    $ref: '../../requestBodies/webhooks/webhook_update.yml'
    
  responses:
    200:
      description: successful operation
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            $ref: ../../schemas/webhooks/webhook_response.yml
    401:
      $ref: '../errors/401.yml'
    404:
      $ref: '../errors/404.yml'
    500:
      $ref: '../errors/500.yml'
  
  parameters:
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'
    - $ref: '../../parameters/commons/path_param/id.yml'

delete:
  tags:
    - Webhooks
  operationId: deleteWebhook
  summary: Delete webhook
  description: Deletes a webhook.

  security:
    - bearerAuth: []
  
  responses:
    200:
      description: successful
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            $ref: '../../schemas/webhooks/webhook_response.yml'
    401:
      $ref: '../errors/401.yml'
    404:
      $ref: '../errors/404.yml'
    500:
      $ref: '../errors/500.yml'
  
  parameters:
    - $ref: '../../parameters/commons/path_param/id.yml'
    - $ref: '../../parameters/commons/headers/accept_language.yml'