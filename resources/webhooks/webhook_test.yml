post:
  tags:
    - Webhooks
  operationId: testWebhook
  summary: Test webhook
  description: Sends a test event to the specified webhook to verify it can receive events.
  responses:
    200:
      description: successful
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            $ref: ../../schemas/webhooks/webhook_response.yml
    401:
      $ref: "../errors/401.yml"
    404:
      $ref: "../errors/404.yml"
    500:
      $ref: "../errors/500.yml"
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../parameters/commons/path_param/id.yml"
    - $ref: "../../parameters/commons/headers/accept_language.yml"
    - $ref: "../../parameters/commons/headers/x_child_company_id.yml"