post:
  tags:
    - Orders
  operationId: createOrder
  summary: Create order
  description: |
    Creates a new order. Optionally, you can include `charges` to create payment charges for the order during creation.
    If checkout parameters are provided and a checkout is created/linked, the response may include a `checkout` object.
  
  security:
    - bearerAuth: []
    
  responses:
    "200":
      description: successful operation
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            $ref: ../../schemas/orders/order_response.yml
          examples:
            cash:
              $ref: ../../schemas/orders/examples/order_cash.yml
    "401":
      $ref: "../errors/401.yml"
    "402":
      $ref: "../errors/402.yml"
    "422":
      $ref: "../errors/422.yml"
    "500":
      $ref: "../errors/500.yml"
  
  requestBody:
    $ref: "../../requestBodies/orders/order.yml"
  
  parameters:
    - $ref: "../../parameters/commons/headers/accept_language.yml"
    - $ref: "../../parameters/commons/headers/x_child_company_id.yml"

get:
  tags:
    - Orders
  operationId: getOrders
  summary: Get a list of Orders
  description: |
    Returns a paginated list of orders created in your account.
    Use pagination parameters to navigate through results, and `search` to filter by supported criteria.
  
  security:
    - bearerAuth: []
  
  responses:
    "200":
      description: successful operation
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            title: get_orders_response
            allOf:
              - $ref: ../../schemas/orders/orders_response.yml
              - $ref: ../../schemas/pagination/pagination.yml
              - $ref: ../../schemas/pagination/page.yml
    "401":
      $ref: "../errors/401.yml"
    "500":
      $ref: "../errors/500.yml"
  
  parameters:
    - $ref: "../../parameters/commons/headers/accept_language.yml"
    - $ref: "../../parameters/commons/headers/x_child_company_id.yml"
    - $ref: "../../parameters/commons/query/limit.yml"
    - $ref: "../../parameters/commons/query/search.yml"
    - $ref: "../../parameters/commons/query/next_page.yml"
    - $ref: "../../parameters/commons/query/previous_page.yml"