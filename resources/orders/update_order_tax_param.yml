put:
  tags:
    - Taxes
  operationId: ordersUpdateTaxes
  summary: Update Tax
  description: >-
    Updates an existing tax line for an order. The tax line identified by `tax_id` belongs
    to the order identified by `id`. Only the fields provided in the request body are updated.
 
  security:
    - bearerAuth: []

  requestBody:
    $ref: '../../requestBodies/orders/order_tax_update.yml'

  responses:
    200:
      description: successful
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            $ref: ../../schemas/orders/update_order_tax_response.yml
    401:
      $ref: '../errors/401.yml'
    404:
      $ref: '../errors/404.yml'
    422:
      $ref: '../errors/422.yml'
    500:
      $ref: '../errors/500.yml'

  parameters:
    - $ref: '../../parameters/commons/path_param/id.yml'
    - $ref: '../../parameters/commons/path_param/tax_id.yml'
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'

delete:
  tags:
    - Taxes
  operationId: ordersDeleteTaxes
  summary: Delete Tax
  description: >-
    Deletes an existing tax line from an order. The tax line identified by `tax_id` belongs
    to the order identified by `id`. The response includes the deleted resource with `deleted: true`.
  
  security:
    - bearerAuth: []

  responses:
    200:
      description: successful
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            $ref: ../../schemas/orders/update_order_tax_response.yml
    401:
      $ref: '../errors/401.yml'
    404:
      $ref: '../errors/404.yml'
    422:
      $ref: '../errors/422.yml'
    500:
      $ref: '../errors/500.yml'

  parameters:
    - $ref: '../../parameters/commons/path_param/id.yml'
    - $ref: '../../parameters/commons/path_param/tax_id.yml'
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'