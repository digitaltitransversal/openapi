post:
  tags:
    - Shippings
  operationId: ordersCreateShipping
  summary: Create Shipping
  description: >-
    Creates a new shipping line for an existing order. The shipping line is added to the
    order identified by `id`. The response returns the created shipping line.

  security:
    - bearerAuth: []

  requestBody:
    $ref: '../../requestBodies/shippings/shipping_create.yml'

  responses:
    200:
      description: successful
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            $ref: ../../schemas/charges/shipping_order_response.yml
          examples:
            successful:
              $ref: ../../schemas/orders/examples/shipping.yml
    401:
      $ref: '../errors/401.yml'
    404:
      $ref: '../errors/404.yml'
    422:
      $ref: '../errors/422.yml'
    500:
      $ref: '../errors/500.yml'
 
  parameters:
    - $ref: '../../parameters/commons/path_param/id.yml'
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'