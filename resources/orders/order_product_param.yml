post:
  tags:
    - Products
  operationId: ordersCreateProduct
  summary: Create Product
  description: >-
    Creates a new product (line item) for an existing order. Use this endpoint
    to add an additional item to the order after it has been created.
  
  security:
    - bearerAuth: []

  requestBody:
    $ref: ../../requestBodies/products/product_create.yml
  
  responses:
    "200":
      description: Successful operation
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            $ref: ../../schemas/charges/product_order_response.yml
    "401":
      $ref: ../errors/401.yml
    "404":
      $ref: ../errors/404.yml
    "500":
      $ref: ../errors/500.yml
  
  parameters:
    - $ref: ../../parameters/commons/path_param/id.yml
    - $ref: ../../parameters/commons/headers/accept_language.yml
    - $ref: ../../parameters/commons/headers/x_child_company_id.yml