delete:
  tags:
    - Orders
  operationId: cancelOrderRefund
  summary: Cancel Refund
  description: >-
    Cancels a refund previously created for an order. This operation is only
    available when the refund is still cancellable according to its current
    status and the payment method rules. If the refund cannot be cancelled, the
    API returns an error response.

  security:
    - bearerAuth: []

  responses:
    "200":
      description: Successful operation
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            $ref: ../../schemas/orders/order_response.yml
    "401":
      $ref: ../errors/401.yml
    "402":
      $ref: ../errors/402.yml
    "404":
      $ref: ../errors/404.yml
    "422":
      $ref: ../errors/422.yml
    "500":
      $ref: ../errors/500.yml
  
  parameters:
    - $ref: ../../parameters/commons/path_param/id.yml
    - $ref: ../../parameters/commons/path_param/refund_id.yml
    - $ref: ../../parameters/commons/headers/accept_language.yml
    - $ref: ../../parameters/commons/headers/x_child_company_id.yml