post:
  tags:
    - Orders
  operationId: CancelOrder
  summary: Cancel Order
  description: >-
    Cancels an existing order. This operation marks the order as cancelled and
    prevents further processing depending on its current state. If the order
    cannot be cancelled (for example, due to its status or related charge
    constraints), the API returns an error response.

  security:
    - bearerAuth: []
    
  responses:
    200:
      description: Successful operation
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            $ref: ../../schemas/orders/order_response.yml
    401:
      $ref: '../errors/401.yml'
    402:
      $ref: '../errors/402.yml'
    404:
      $ref: '../errors/404.yml'
    428:
      $ref: ../errors/428.yml
    500:
      $ref: ../errors/500.yml
 
  parameters:
    - $ref: '../../parameters/commons/path_param/id.yml'
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'