get:
  tags:
    - Balances
  operationId: getBalance
  summary: Get a company's balance
  description: |
    Retrieves the current balance information for the authenticated company.

    Monetary fields are returned as arrays of amounts grouped by currency.

  security:
    - bearerAuth: []

  responses:
    200:
      description: successful operation
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            $ref: ../../schemas/balances/balance_response.yml
    401:
      $ref: ../errors/401.yml
    402:
      $ref: ../errors/402.yml
    422:
      $ref: ../errors/422.yml
    500:
      $ref: ../errors/500.yml

  parameters:
    - $ref: ../../parameters/commons/headers/accept_language.yml