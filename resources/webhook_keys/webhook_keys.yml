get:
  tags:
    - Webhook keys
  operationId: getWebhookKeys
  summary: Get webhook keys
  description: Returns a paginated list of webhook signing keys for the current company.
  
  security:
    - bearerAuth: []

  responses:
    200:
      description: successful
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            title: get_webhook_keys_response
            allOf:
              - $ref: ../../schemas/pagination/pagination.yml
              - $ref: ../../schemas/pagination/page.yml
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../schemas/webhook-keys/webhook-key_response.yml'
    401:
      $ref: '../errors/401.yml'
    500:
      $ref: '../errors/500.yml'
 
  parameters:
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'
    - $ref: '../../parameters/commons/query/limit.yml'
    - $ref: '../../parameters/commons/query/search.yml'
    - $ref: '../../parameters/commons/query/next_page.yml'
    - $ref: '../../parameters/commons/query/previous_page.yml'

post:
  tags:
    - Webhook keys
  operationId: createWebhookKey
  summary: Create webhook key
  description: Creates a new webhook signing key for the current company.

  security:
    - bearerAuth: []

  requestBody:
    content:
      application/vnd.app-v2.2.0+json:
        schema:
          type: object
          title: webhook_key_request
          properties:
            active:
              type: boolean
              example: true
              description: Indicates if the webhook key is active
              default: true
              nullable: true
  
  responses:
    '200':
      description: successful operation
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            $ref: '../../schemas/webhook-keys/webhook-key_create_response.yml'
    401:
      $ref: '../errors/401.yml'
    500:
      $ref: '../errors/500.yml'

  parameters:
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'