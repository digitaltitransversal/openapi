get:
  tags:
    - Webhook keys
  operationId: getWebhookKey
  summary: Get webhook key
  description: Retrieves the details of a webhook signing key by its ID.
  
  security:
    - bearerAuth: []

  responses:
    200:
      description: successful operation
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            $ref: '../../schemas/webhook-keys/webhook-key_response.yml'
    401:
      $ref: '../errors/401.yml'
    404:
      $ref: '../errors/404.yml'
    500:
      $ref: '../errors/500.yml'
  
  parameters:
    - $ref: '../../parameters/commons/path_param/id.yml'
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'

put:
  tags:
    - Webhook keys
  operationId: updateWebhookKey
  summary: Update webhook key
  description: Activates or deactivates an existing webhook signing key.

  security:
    - bearerAuth: []

  requestBody:
    content:
      application/vnd.app-v2.1.0+json:
        schema:
          type: object
          title: webhook_key_update_request
          properties:
            active:
              type: boolean
              example: false
              description: Indicates if the webhook key is active
              default: false

  responses:
    200:
      description: successful operation
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            $ref: '../../schemas/webhook-keys/webhook-key_response.yml'
    401:
      $ref: '../errors/401.yml'
    404:
      $ref: '../errors/404.yml'
    500:
      $ref: '../errors/500.yml'
  
  parameters:
    - $ref: '../../parameters/commons/path_param/id.yml'
    - $ref: '../../parameters/commons/headers/accept_language.yml'

delete:
  tags:
    - Webhook keys
  operationId: deleteWebhookKey
  summary: Delete webhook key
  description: Deletes a webhook signing key.

  security:
    - bearerAuth: []

  responses:
    200:
      description: successful
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            $ref: '../../schemas/webhook-keys/webhook-key_delete_response.yml'
    401:
      $ref: '../errors/401.yml'
    404:
      $ref: '../errors/404.yml'
    500:
      $ref: '../errors/500.yml'
  
  parameters:
    - $ref: '../../parameters/commons/path_param/id.yml'
    - $ref: '../../parameters/commons/headers/accept_language.yml'
