put:
  tags:
    - Charges
  operationId: updateCharge
  summary: Update a charge
  description: Updates an existing charge. Only `reference_id` can be updated.
  
  security:
    - bearerAuth: []
  
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../requestBodies/charges/charge_update.yml"
  
  responses:
    "200":
      description: successful
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            $ref: "../../schemas/charges/charge_response.yml"
    "401":
      $ref: "../errors/401.yml"
    "404":
      $ref: "../errors/404.yml"
    "422":
      $ref: "../errors/422.yml"
    "500":
      $ref: "../errors/500.yml"
  
  parameters:
    - $ref: "../../parameters/commons/path_param/id.yml"
    - $ref: "../../parameters/commons/headers/accept_language.yml"
    - $ref: "../../parameters/commons/headers/x_child_company_id.yml"