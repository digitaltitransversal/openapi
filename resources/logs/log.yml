get:
  tags:
    - Logs
  operationId: getLogs
  summary: Get List Of Logs
  description: |
    Returns a paginated list of logs generated by the platform. Logs can be used for troubleshooting and auditing requests and internal operations.
    Use pagination parameters to navigate through results, and `search` to filter by supported criteria.
  
  security:
    - bearerAuth: []

  responses:
    200:
      description: successful operation
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            $ref: '../../schemas/logs/logs_response.yml'
    401:
      $ref: '../errors/401.yml'
    500:
      $ref: '../errors/500.yml'
      
  parameters:
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'
    - $ref: '../../parameters/commons/query/limit.yml'
    - $ref: '../../parameters/commons/query/search.yml'
    - $ref: '../../parameters/commons/query/next_page.yml'
    - $ref: '../../parameters/commons/query/previous_page.yml'