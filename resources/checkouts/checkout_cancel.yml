put:
  tags:
    - Payment Link
  operationId: cancelCheckout
  summary: Cancel Payment Link
  description: >-
    Cancels an existing payment link. After cancellation, the link can no longer be used
    to generate new payments. This operation is idempotent: cancelling an already cancelled
    payment link returns the current resource representation.
  
  security:
    - bearerAuth: []
    
  responses:
    200:
      description: successful operation
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            $ref: '../../schemas/checkouts/checkout_response.yml'
    401:
      $ref: '../errors/401.yml'
    402:
      $ref: '../errors/402.yml'
    404:
      $ref: '../errors/404.yml'
    422:
      $ref: '../errors/422.yml'
    500:
      $ref: '../errors/500.yml'
  
  parameters:
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'
    - $ref: '../../parameters/commons/path_param/id.yml'