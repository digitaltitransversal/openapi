get:
  tags:
    - Payment Link
  operationId: getCheckout
  summary: Get a payment link by ID
  description: Retrieves the details of a checkout by its ID.

  security:
    - bearerAuth: []

  responses:
    200:
      description: successful operation
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            $ref: '../../schemas/checkouts/checkout_response.yml'
    401:
      $ref: '../errors/401.yml'
    402:
      $ref: '../errors/402.yml'
    404:
      $ref: '../errors/404.yml'
    500:
      $ref: '../errors/500.yml'

  parameters:
    - $ref: '../../parameters/commons/path_param/id.yml'
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'