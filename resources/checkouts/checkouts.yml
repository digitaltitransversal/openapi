get:
  tags:
    - Payment Link
  operationId: getCheckouts
  summary: Get a list of payment links
  description: >-
    Returns a paginated list of payment links created by the merchant. Results
    can be navigated using the pagination parameters.

  security:
    - bearerAuth: []

  responses:
    200:
      description: successful operation
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            title: checkouts_response
            allOf:
              - $ref: ../../schemas/pagination/pagination.yml
              - $ref: ../../schemas/pagination/page.yml
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../schemas/checkouts/checkout_response.yml'
    401:
      $ref: '../errors/401.yml'
    402:
      $ref: '../errors/402.yml'
    422:
      $ref: '../errors/422.yml'
    500:
      $ref: ../errors/500.yml

  parameters:
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'
    - $ref: '../../parameters/commons/query/limit.yml'
    - $ref: '../../parameters/commons/query/search.yml'
    - $ref: '../../parameters/commons/query/next_page.yml'
    - $ref: '../../parameters/commons/query/previous_page.yml'

post:
  tags:
    - Payment Link
  operationId: createCheckout
  summary: Create Unique Payment Link
  description: >-
    Creates a new payment link. The request body defines the payment link type,
    allowed payment methods, and expiration settings.

  security:
    - bearerAuth: []
  
  requestBody:
    $ref: '../../requestBodies/checkouts/checkout.yml'

  responses:
    200:
      description: successful operation
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            $ref: '../../schemas/checkouts/checkout_response.yml'
    401:
      $ref: '../errors/401.yml'
    402:
      $ref: '../errors/402.yml'
    422:
      $ref: '../errors/422.yml'
    500:
      $ref: ../errors/500.yml

  parameters:
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'
