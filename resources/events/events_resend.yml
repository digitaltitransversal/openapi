post:
  tags:
    - Events
  operationId: resendEvent
  summary: Resend Event
  description: |
    Triggers a new delivery attempt for a specific webhook log associated with the given event.
    Use this endpoint to retry failed webhook deliveries (for example, non-2xx responses or timeouts). The response returns the updated webhook log with the latest attempt metadata.

  security:
    - bearerAuth: []

  responses:
    "200":
      description: successful operation
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            $ref: ../../schemas/events/events_resend_response.yml
    "401":
      $ref: "../errors/401.yml"
    "404":
      $ref: "../errors/404.yml"
    "500":
      $ref: "../errors/500.yml"
      
  parameters:
    - $ref: "../../parameters/commons/path_param/event_id.yml"
    - $ref: "../../parameters/commons/path_param/webhook_log_id.yml"
    - $ref: "../../parameters/commons/headers/accept_language.yml"