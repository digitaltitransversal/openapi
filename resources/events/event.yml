get:
  tags:
    - Events
  operationId: getEvent
  summary: Get Event
  description: |
    Returns a single event by its ID, including its payload (`data`) and webhook delivery information.
    The `webhook_status` indicates whether webhook notifications were applicable and their overall status. The [webhook_logs]) array contains delivery attempts (it can be empty when webhook notifications are not applicable or no attempts were created).

  security:
    - bearerAuth: []

  responses:
    "200":
      description: successful
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            $ref: "../../schemas/events/event_response.yml"
    "401":
      $ref: "../errors/401.yml"
    "404":
      $ref: "../errors/404.yml"
    "500":
      $ref: "../errors/500.yml"
      
  parameters:
    - $ref: "../../parameters/commons/headers/accept_language.yml"
    - $ref: "../../parameters/commons/headers/x_child_company_id.yml"
    - $ref: "../../parameters/commons/path_param/id.yml"