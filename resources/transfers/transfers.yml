get:
  tags:
    - Transfers
  operationId: getTransfers
  summary: List transfers
  description: |
    Returns a paginated list of transfers (payouts/dispersions).

    A transfer represents a payout of funds to the merchant (where the money is sent and the payout status).
    Transfers typically aggregate multiple transactions.

    If you need movement-level details (amount/fee/net per operation) or to reconcile charges, use GET /transactions.

  security:
    - bearerAuth: []

  responses:
    200:
      description: successful
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            title: get_transfers_response
            allOf:
              - $ref: ../../schemas/pagination/pagination.yml
              - $ref: ../../schemas/pagination/page.yml
              - type: object
                properties:
                  data:
                    description: Transfers
                    type: array
                    items:
                      $ref: '../../schemas/transfers/transfers_response.yml'
    401:
      $ref: '../errors/401.yml'
    500:
      $ref: '../errors/500.yml'
  
  parameters:
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'
    - $ref: '../../parameters/commons/query/limit.yml'
    - $ref: '../../parameters/commons/query/search.yml'
    - $ref: '../../parameters/commons/query/next_page.yml'
    - $ref: '../../parameters/commons/query/previous_page.yml'