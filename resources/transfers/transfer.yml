get:
  tags:
    - Transfers
  operationId: getTransfer
  summary: Get transfer
  description: Retrieves the details of a transfer by its ID.

  security:
    - bearerAuth: []

  responses:
    "200":
      description: Successful operation
      content:
        application/vnd.app-v2.2.0+json:
          schema:
            $ref: '../../schemas/transfers/transfer_response.yml'

    "401":
      $ref: ../errors/401.yml
    "500":
      $ref: ../errors/500.yml

  parameters:
    - $ref: ../../parameters/commons/headers/accept_language.yml
    - $ref: ../../parameters/commons/headers/x_child_company_id.yml
    - $ref: '../../parameters/commons/path_param/id.yml'