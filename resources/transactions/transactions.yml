get:
  tags:
    - Transactions
  operationId: getTransactions
  summary: List transactions
  description: |
    Returns a paginated list of transactions (ledger movements).

    A transaction is a movement that represents the financial impact of payment operations, including amounts, fees, and net values.
    Transactions can be linked to a charge and may be linked to a transfer (payout) when they are included in a payout.

    If you need payout-level information (destination, statement reference/description, payout status), use GET /transfers.
  
  security:
    - bearerAuth: []

  responses:
    200:
      description: successful operation
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            title: get_transactions_response
            allOf:
              - $ref: ../../schemas/pagination/pagination.yml
              - $ref: ../../schemas/pagination/page.yml
              - type: object
                properties:
                  data:
                    description: Transactions (ledger movements)
                    type: array
                    items:
                      $ref: '../../schemas/transactions/transaction_response.yml'
    401:
      $ref: '../errors/401.yml'
    500:
      $ref: '../errors/500.yml'

  parameters:
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'
    - $ref: '../../parameters/commons/query/limit.yml'
    - $ref: '../../parameters/commons/query/next_page.yml'
    - $ref: '../../parameters/commons/query/previous_page.yml'
    - $ref: '../../parameters/commons/query/id_query.yml'
    - $ref: '../../parameters/commons/query/charge_id.yml'
    - $ref: '../../parameters/commons/query/type.yml'
    - $ref: '../../parameters/commons/query/currency.yml'