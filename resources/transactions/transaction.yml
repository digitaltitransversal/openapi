get:
  tags:
    - Transactions
  operationId: getTransaction
  summary: Get transaction
  description: Retrieves the details of a transaction by its ID.

  security:
    - bearerAuth: []

  responses:
    200:
      description: successful
      content:
        application/vnd.app-v2.1.0+json:
          schema:
            $ref: '../../schemas/transactions/transaction_response.yml'
    401:
      $ref: '../errors/401.yml'
    404:
      $ref: '../errors/404.yml'
    500:
      $ref: '../errors/500.yml'

  parameters:
    - $ref: '../../parameters/commons/headers/accept_language.yml'
    - $ref: '../../parameters/commons/headers/x_child_company_id.yml'
    - $ref: '../../parameters/commons/path_param/id.yml'